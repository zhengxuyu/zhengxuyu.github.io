---
layout: default
---

<style>
/* Works Page */
.works-page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 0 0 0;
}

.works-hero {
  text-align: center;
  padding: 60px 20px 50px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  margin: 0 0 40px 0;
  border-radius: var(--border-radius-lg);
  position: relative;
  overflow: hidden;
  box-shadow: var(--glass-shadow);
}

.works-hero h1 {
  font-size: 2.8em;
  font-weight: 700;
  margin-bottom: 16px;
  color: white;
  position: relative;
  z-index: 2;
}

.works-hero p {
  font-size: 1.15em;
  color: rgba(255, 255, 255, 0.9);
  max-width: 650px;
  margin: 0 auto;
  line-height: 1.6;
  position: relative;
  z-index: 2;
}

.works-section {
  margin-bottom: 60px;
}

.section-header {
  text-align: center;
  margin-bottom: 40px;
}

.section-title {
  font-size: 2em;
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 12px;
  position: relative;
  display: inline-block;
}

.section-title::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 3px;
  background: #E8B878;
  border-radius: 2px;
}

.section-subtitle {
  font-size: 1em;
  color: var(--color-text-tertiary);
  max-width: 550px;
  margin: 0 auto;
}

.works-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 24px;
  margin-top: 32px;
}

.work-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: var(--border-radius-lg);
  box-shadow: var(--glass-shadow);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border: 1px solid var(--glass-border);
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: stretch;
}

.work-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.work-image {
  width: 160px;
  min-height: 160px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.8em;
  font-weight: 700;
  position: relative;
  overflow: hidden;
}

.work-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.work-image .work-image-fallback {
  display: none;
}

.github-stats {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  font-size: 0.85em;
  color: rgba(255,255,255,0.5);
}

.github-stat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.github-stat svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.github-stat .stat-count {
  font-weight: 600;
  color: rgba(255,255,255,0.75);
}

.github-stats .github-lang {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.github-lang .lang-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.work-content {
  padding: 24px;
}

.work-title {
  font-size: 1.3em;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--color-text-primary);
  line-height: 1.3;
}

.work-description {
  color: var(--color-text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
  font-size: 0.92em;
}

.work-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

.work-tag {
  background: rgba(232, 184, 120, 0.15);
  color: #E8B878;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.82em;
  font-weight: 500;
  border: 1px solid rgba(232, 184, 120, 0.3);
  transition: var(--transition-theme);
}

.work-links {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.work-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: rgba(196, 132, 62, 0.85);
  color: white;
  text-decoration: none;
  border-radius: var(--border-radius);
  font-size: 0.85em;
  font-weight: 600;
  transition: background 0.3s ease;
}
.work-link:hover {
  background: rgba(196, 132, 62, 1);
  color: white;
}
.work-link.secondary {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.work-link.secondary:hover {
  background: rgba(255, 255, 255, 0.2);
}

@media (max-width: 768px) {
  .works-hero h1 {
    font-size: 2em;
  }

  .works-hero p {
    font-size: 1em;
  }

  .section-title {
    font-size: 1.6em;
  }

  .works-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .work-card {
    flex-direction: column;
  }

  .work-image {
    width: 100%;
    height: 140px;
    min-height: 140px;
    font-size: 1.5em;
  }

  .work-content {
    padding: 20px;
  }
}

@media (max-width: 480px) {
  .works-hero {
    padding: 36px 16px 28px;
  }

  .works-hero h1 {
    font-size: 1.75em;
  }

  .work-links {
    flex-direction: column;
  }

  .work-link {
    justify-content: center;
  }
}
</style>

<div class="works-page">
  <div class="works-hero">
    <h1>My Works</h1>
    <p>Exploring my research achievements and projects in machine learning, artificial intelligence, and computer vision</p>
  </div>

  {{ content }}
</div>

<script>
(function() {
  var LANG_COLORS = {
    Python: '#3572A5', JavaScript: '#f1e05a', TypeScript: '#3178c6',
    'C++': '#f34b7d', Java: '#b07219', Go: '#00ADD8', Rust: '#dea584',
    Ruby: '#701516', Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c',
    'Jupyter Notebook': '#DA5B0B', Swift: '#F05138', Kotlin: '#A97BFF'
  };

  document.querySelectorAll('.work-card[data-repo]').forEach(function(card) {
    var repo = card.getAttribute('data-repo');
    var img = card.querySelector('.work-image img');
    if (img) {
      img.src = 'https://opengraph.githubassets.com/1/' + repo;
      img.alt = repo;
      img.onerror = function() {
        this.style.display = 'none';
        var fallback = this.parentElement.querySelector('.work-image-fallback');
        if (fallback) fallback.style.display = 'flex';
      };
    }

    fetch('https://api.github.com/repos/' + repo)
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        if (!data) return;
        var statsEl = card.querySelector('.github-stats');
        if (!statsEl) return;

        var html = '';
        html += '<span class="github-stat">' +
          '<svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25z"/></svg>' +
          '<span class="stat-count">' + (data.stargazers_count >= 1000 ? (data.stargazers_count / 1000).toFixed(1) + 'k' : data.stargazers_count) + '</span></span>';

        html += '<span class="github-stat">' +
          '<svg viewBox="0 0 16 16"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>' +
          '<span class="stat-count">' + data.forks_count + '</span></span>';

        if (data.language) {
          var color = LANG_COLORS[data.language] || '#888';
          html += '<span class="github-lang">' +
            '<span class="lang-dot" style="background:' + color + '"></span>' +
            data.language + '</span>';
        }

        statsEl.innerHTML = html;
      })
      .catch(function() {});
  });
})();
</script>
